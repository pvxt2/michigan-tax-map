name: Build site

# Run it by hand from the Actions tab. When it finishes, download the zip files from the
# run page and upload them to Bluehost (see README, "Publishing on Bluehost").
on:
  workflow_dispatch:
    inputs:
      refresh_basemap:
        description: "Download a fresh basemap (otherwise this year's saved copy is reused)"
        type: boolean
        default: false
      include_basemap:
        description: "Include the basemap file in the downloads even if it hasn't changed"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FULL: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Copy map libraries and fonts into the site
        run: bash pipeline/vendor.sh

      - uses: actions/setup-python@v6
        if: env.FULL == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install build tools
        if: env.FULL == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils libsqlite3-dev zlib1g-dev build-essential
          pip install -q -r pipeline/requirements.txt

      - name: Cache tippecanoe
        if: env.FULL == 'true'
        id: tip
        uses: actions/cache@v5
        with:
          path: ~/tippecanoe-bin
          key: tippecanoe-${{ runner.os }}-v2

      - name: Build tippecanoe
        if: env.FULL == 'true' && steps.tip.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          mkdir -p ~/tippecanoe-bin
          cp /tmp/tippecanoe/tippecanoe /tmp/tippecanoe/tile-join ~/tippecanoe-bin/

      - name: Install pmtiles command-line tool
        if: env.FULL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$HOME/tippecanoe-bin" >> "$GITHUB_PATH"
          gh release download -R protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' -D /tmp/pmt
          tar -xzf /tmp/pmt/*.tar.gz -C /tmp/pmt
          sudo install /tmp/pmt/pmtiles /usr/local/bin/pmtiles
          pmtiles version || true

      - name: Download boundaries
        if: env.FULL == 'true'
        run: python pipeline/fetch_boundaries.py

      - name: Read the Treasury rates report
        if: env.FULL == 'true'
        run: |
          mkdir -p work
          PDF=$(python -c "import json;print(json.load(open('config.json')).get('rates_pdf',''))")
          if [ -n "$PDF" ] && [ -f "$PDF" ]; then
            echo "Using $PDF from the repository"
            cp "$PDF" work/rates.pdf
          else
            URL=$(python -c "import json;print(json.load(open('config.json'))['rates_pdf_url'])")
            echo "No saved PDF; downloading $URL"
            curl -fsSL -A "Mozilla/5.0 (michigan-tax-map build)" "$URL" -o work/rates.pdf
          fi
          python pipeline/parse_rates.py work/rates.pdf work/rates.csv

      - name: Match rates to boundaries
        if: env.FULL == 'true'
        run: python pipeline/build_layers.py

      - name: Show match report
        if: always() && env.FULL == 'true'
        run: |
          cat work/qa/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report" >> "$GITHUB_STEP_SUMMARY"
          # Also print the detail files into the log, so they can be read without downloading.
          for f in work/qa/*.csv; do [ -f "$f" ] && { echo "===== $f"; head -n 200 "$f"; }; done || true

      - name: Save match report files
        if: always() && env.FULL == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: match-report
          path: work/qa/
          if-no-files-found: ignore

      - name: Make tax map tiles
        if: env.FULL == 'true'
        run: bash pipeline/make_tiles.sh

      - name: Pick basemap year
        if: env.FULL == 'true'
        id: month
        run: echo "m=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      # The basemap is re-cut once a year (or when asked); otherwise the saved copy is reused.
      - name: Cache basemap
        if: env.FULL == 'true'
        id: bm
        uses: actions/cache@v5
        with:
          path: |
            site/data/basemap.pmtiles
            site/data/basemap-overview.pmtiles
            site/data/basemap-build.txt
          key: basemap-v2-${{ hashFiles('config.json', 'pipeline/fetch_basemap.sh') }}-${{ steps.month.outputs.m }}

      - name: Download basemap
        id: bmfetch
        if: env.FULL == 'true' && (inputs.refresh_basemap || steps.bm.outputs.cache-hit != 'true')
        run: |
          bash pipeline/fetch_basemap.sh
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Put the site together
        run: |
          rm -rf dist dist-basemap && cp -r site dist
          mv dist/htaccess.txt dist/.htaccess
          mkdir -p dist-basemap/data
          mv dist/data/basemap.pmtiles dist/data/basemap-build.txt dist-basemap/data/
          du -sh dist dist-basemap
          {
            echo "## Files to upload"
            echo ""
            echo "- **site-update**: upload and extract in the subdomain's folder every time ($(du -sh dist | cut -f1), includes the small overview basemap)."
            if [ "${{ steps.bmfetch.outputs.fresh }}" = "true" ] || [ "${{ inputs.include_basemap }}" = "true" ]; then
              echo "- **basemap**: new this run. Upload and extract it too ($(du -sh dist-basemap | cut -f1), basemap build $(cat dist-basemap/data/basemap-build.txt))."
            else
              echo "- **basemap**: unchanged, so it is not included. The copy already on Bluehost is still current."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the site files
        uses: actions/upload-artifact@v6
        with:
          name: site-update
          path: dist/
          include-hidden-files: true
          retention-days: 30

      - name: Save the basemap
        if: steps.bmfetch.outputs.fresh == 'true' || inputs.include_basemap
        uses: actions/upload-artifact@v6
        with:
          name: basemap
          path: dist-basemap/
          compression-level: 0
          retention-days: 30
